<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Data Mata Pelajaran</title>
    <!-- Required meta tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Latihan Modal Bootstrap" />
    <meta name="author" content="Scientia" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark bg-success">
        <a class="navbar-brand ms-2" href="#"> Sekolah</a>
        <button
          class="navbar-toggler d-lg-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapsibleNavId"
          aria-controls="collapsibleNavId"
          aria-expanded="false"
          aria-label="Toggle navigation"
        ></button>
        <div class="collapse navbar-collapse" id="collapsibleNavId">
          <ul class="navbar-nav me-auto mt-2 mt-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="#">Beranda</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html">Siswa</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="guru.html">Guru</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="mapel.html">Mata Pelajaran </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="container">
      <div class="card mt-5">
        <div class="card-header bg-success text-white">
          <div class="row">
            <div class="col d-flex">
              <div class="card-title fs-5">Data Mata Pelajaran</div>
              <div class="col text-end">
                <button
                  type="button"
                  class="btn btn-outline-light float-end"
                  data-bs-toggle="modal"
                  data-bs-target="#tambahDataModal"
                >
                  Tambah
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="card-body">
          <table class="table table-bordered table-striped" id="mapelTable">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama Mapel</th>
                <th>Jenis Mapel</th>
                <th>KKM</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>PPB</td>
                <td>Produktif</td>
                <td>75</td>
                <td>
                  <button
                    type="button"
                    class="btn btn-warning btn-sm btn-edit"
                    data-bs-toggle="modal"
                    data-bs-target="#editDataModal"
                  >
                    Ubah
                  </button>
                  <button
                    type="button"
                    class="btn btn-danger btn-sm btn-delete"
                  >
                    Hapus
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal Tambah -->
    <div
      class="modal fade"
      id="tambahDataModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Tambah Data Mata Pelajaran</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="tambahForm">
              <div class="mb-3 row">
                <label for="tambahNama" class="col-sm-3 col-form-label">Nama Mapel</label>
                <div class="col-sm-9">
                  <input type="text" id="tambahNama" class="form-control" required />
                </div>
              </div>

              <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">Jenis Mapel</label>
                <div class="col-sm-9">
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tambahJenis" id="tambahProduktif" value="Produktif" required>
                    <label class="form-check-label" for="tambahProduktif">Produktif</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tambahJenis" id="tambahNormatif" value="Normatif">
                    <label class="form-check-label" for="tambahNormatif">Normatif</label>
                  </div>
                </div>
              </div>

              <div class="mb-3 row">
                <label for="tambahKKM" class="col-sm-3 col-form-label">KKM</label>
                <div class="col-sm-9">
                  <input type="number" id="tambahKKM" class="form-control" required />
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Edit -->
    <div
      class="modal fade"
      id="editDataModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Ubah Data Mata Pelajaran</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="editForm">
              <input type="hidden" id="editIndex" />
              <div class="mb-3 row">
                <label for="editNama" class="col-sm-3 col-form-label">Nama Mapel</label>
                <div class="col-sm-9">
                  <input type="text" id="editNama" class="form-control" required />
                </div>
              </div>

              <div class="mb-3 row">
                <label class="col-sm-3 col-form-label">Jenis Mapel</label>
                <div class="col-sm-9">
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="editJenis" id="editProduktif" value="Produktif" required>
                    <label class="form-check-label" for="editProduktif">Produktif</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="editJenis" id="editNormatif" value="Normatif">
                    <label class="form-check-label" for="editNormatif">Normatif</label>
                  </div>
                </div>
              </div>

              <div class="mb-3 row">
                <label for="editKKM" class="col-sm-3 col-form-label">KKM</label>
                <div class="col-sm-9">
                  <input type="number" id="editKKM" class="form-control" required />
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="submit" class="btn btn-primary">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const tableBody = document.querySelector("#mapelTable tbody");

      // Tambah
      document.querySelector("#tambahForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const nama = document.querySelector("#tambahNama").value;
        const jenis = document.querySelector("input[name='tambahJenis']:checked").value;
        const kkm = document.querySelector("#tambahKKM").value;

        const rowCount = tableBody.rows.length + 1;
        const newRow = `
          <tr>
            <td>${rowCount}</td>
            <td>${nama}</td>
            <td>${jenis}</td>
            <td>${kkm}</td>
            <td>
              <button type="button" class="btn btn-warning btn-sm btn-edit" data-bs-toggle="modal" data-bs-target="#editDataModal">Ubah</button>
              <button type="button" class="btn btn-danger btn-sm btn-delete">Hapus</button>
            </td>
          </tr>
        `;
        tableBody.insertAdjacentHTML("beforeend", newRow);
        document.querySelector("#tambahForm").reset();
        bootstrap.Modal.getInstance(document.querySelector("#tambahDataModal")).hide();
      });

      // Edit
      tableBody.addEventListener("click", function(e) {
        if (e.target.classList.contains("btn-edit")) {
          const row = e.target.closest("tr");
          document.querySelector("#editIndex").value = row.rowIndex - 1;
          document.querySelector("#editNama").value = row.cells[1].textContent;
          document.querySelector(`#edit${row.cells[2].textContent}`).checked = true;
          document.querySelector("#editKKM").value = row.cells[3].textContent;
        }
      });

      document.querySelector("#editForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const index = document.querySelector("#editIndex").value;
        const row = tableBody.rows[index];
        row.cells[1].textContent = document.querySelector("#editNama").value;
        row.cells[2].textContent = document.querySelector("input[name='editJenis']:checked").value;
        row.cells[3].textContent = document.querySelector("#editKKM").value;
        bootstrap.Modal.getInstance(document.querySelector("#editDataModal")).hide();
      });

      // Hapus
      tableBody.addEventListener("click", function(e) {
        if (e.target.classList.contains("btn-delete")) {
          e.target.closest("tr").remove();
          [...tableBody.rows].forEach((row, i) => row.cells[0].textContent = i + 1);
        }
      });
    </script>
  </body>
</html>
