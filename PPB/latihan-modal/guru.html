<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Data Guru</title>
    <!-- Required meta tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Latihan Modal Bootstrap" />
    <meta name="author" content="Scientia" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-md navbar-dark bg-success">
        <a class="navbar-brand ms-2" href="#"> Sekolah</a>
        <button
          class="navbar-toggler d-lg-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapsibleNavId"
          aria-controls="collapsibleNavId"
          aria-expanded="false"
          aria-label="Toggle navigation"
        ></button>
        <div class="collapse navbar-collapse" id="collapsibleNavId">
          <ul class="navbar-nav me-auto mt-2 mt-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
            <li class="nav-item"><a class="nav-link" href="siswa.html">Siswa</a></li>
            <li class="nav-item"><a class="nav-link active" href="guru.html">Guru</a></li>
            <li class="nav-item"><a class="nav-link" href="mapel.html">Mata Pelajaran</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="container">
      <div class="card mt-5">
        <div class="card-header bg-success text-white">
          <div class="row">
            <div class="col d-flex">
              <div class="card-title fs-5">Data Guru</div>
              <div class="col text-end">
                <button
                  type="button"
                  class="btn btn-outline-light float-end"
                  data-bs-toggle="modal"
                  data-bs-target="#tambahDataModal"
                >
                  Tambah
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="card-body">
          <table class="table table-bordered table-striped" id="guruTable">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama Guru</th>
                <th>Ijazah Terakhir</th>
                <th>Jenis Guru</th>
                <th>Nama Mapel</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>Ronald Levy</td>
                <td>S1</td>
                <td>Normatif</td>
                <td>Bahasa Perancis</td>
                <td>
                  <button type="button" class="btn btn-warning btn-sm btn-edit" data-bs-toggle="modal" data-bs-target="#editDataModal">Ubah</button>
                  <button type="button" class="btn btn-danger btn-sm btn-delete">Hapus</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal Tambah -->
    <div class="modal fade" id="tambahDataModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="tambahForm">
            <div class="modal-header">
              <h5 class="modal-title">Tambah Data Guru</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="tambahNama" class="form-label">Nama Guru</label>
                <input type="text" id="tambahNama" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="tambahIjazah" class="form-label">Ijazah Terakhir</label>
                <select id="tambahIjazah" class="form-select" required>
                  <option value="" selected disabled>Pilih Tingkatan</option>
                  <option>SMP</option>
                  <option>SMA</option>
                  <option>S1</option>
                  <option>S2</option>
                  <option>S3</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Jenis Guru</label><br />
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="tambahJenis" id="tambahProduktif" value="Produktif" required />
                  <label class="form-check-label" for="tambahProduktif">Produktif</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="tambahJenis" id="tambahNormatif" value="Normatif" />
                  <label class="form-check-label" for="tambahNormatif">Normatif</label>
                </div>
              </div>
              <div class="mb-3">
                <label for="tambahMapel" class="form-label">Nama Mapel</label>
                <input type="text" id="tambahMapel" class="form-control" required />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal Edit -->
    <div class="modal fade" id="editDataModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editForm">
            <div class="modal-header">
              <h5 class="modal-title">Ubah Data Guru</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editIndex" />
              <div class="mb-3">
                <label for="editNama" class="form-label">Nama Guru</label>
                <input type="text" id="editNama" class="form-control" required />
              </div>
              <div class="mb-3">
                <label for="editIjazah" class="form-label">Ijazah Terakhir</label>
                <select id="editIjazah" class="form-select" required>
                  <option>SMP</option>
                  <option>SMA</option>
                  <option>S1</option>
                  <option>S2</option>
                  <option>S3</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Jenis Guru</label><br />
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="editJenis" id="editProduktif" value="Produktif" required />
                  <label class="form-check-label" for="editProduktif">Produktif</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="editJenis" id="editNormatif" value="Normatif" />
                  <label class="form-check-label" for="editNormatif">Normatif</label>
                </div>
              </div>
              <div class="mb-3">
                <label for="editMapel" class="form-label">Nama Mapel</label>
                <input type="text" id="editMapel" class="form-control" required />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const tableBody = document.querySelector("#guruTable tbody");

      // Tambah
      document.querySelector("#tambahForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const nama = document.querySelector("#tambahNama").value;
        const ijazah = document.querySelector("#tambahIjazah").value;
        const jenis = document.querySelector("input[name='tambahJenis']:checked").value;
        const mapel = document.querySelector("#tambahMapel").value;

        const rowCount = tableBody.rows.length + 1;
        const newRow = `
          <tr>
            <td>${rowCount}</td>
            <td>${nama}</td>
            <td>${ijazah}</td>
            <td>${jenis}</td>
            <td>${mapel}</td>
            <td>
              <button type="button" class="btn btn-warning btn-sm btn-edit" data-bs-toggle="modal" data-bs-target="#editDataModal">Ubah</button>
              <button type="button" class="btn btn-danger btn-sm btn-delete">Hapus</button>
            </td>
          </tr>
        `;
        tableBody.insertAdjacentHTML("beforeend", newRow);
        document.querySelector("#tambahForm").reset();
        bootstrap.Modal.getInstance(document.querySelector("#tambahDataModal")).hide();
      });

      // Load into edit form
      tableBody.addEventListener("click", function (e) {
        if (e.target.classList.contains("btn-edit")) {
          const row = e.target.closest("tr");
          document.querySelector("#editIndex").value = row.rowIndex - 1;
          document.querySelector("#editNama").value = row.cells[1].textContent;
          document.querySelector("#editIjazah").value = row.cells[2].textContent;
          document.querySelector(`#edit${row.cells[3]}`).checked = true;
          document.querySelector("#editMapel").value = row.cells[4].textContent;
        }
      });

      // Simpan edit
      document.querySelector("#editForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const index = document.querySelector("#editIndex").value;
        const row = tableBody.rows[index];
        row.cells[1].textContent = document.querySelector("#editNama").value;
        row.cells[2].textContent = document.querySelector("#editIjazah").value;
        row.cells[3].textContent = document.querySelector("input[name='editJenis']:checked").value;
        row.cells[4].textContent = document.querySelector("#editMapel").value;
        bootstrap.Modal.getInstance(document.querySelector("#editDataModal")).hide();
      });

      // Hapus
      tableBody.addEventListener("click", function (e) {
        if (e.target.classList.contains("btn-delete")) {
          e.target.closest("tr").remove();
          [...tableBody.rows].forEach((row, i) => row.cells[0].textContent = i + 1);
        }
      });
    </script>
  </body>
</html>
