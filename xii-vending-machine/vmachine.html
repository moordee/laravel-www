<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Scientia's Vending Machine</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .animate-character {
        background-image: linear-gradient(
          -225deg,
          #ffffff 0%,
          #15ff00 40%,
          #00a10d 67%,
          #f2ff00 100%
        );
        background-size: auto auto;
        background-clip: border-box;
        background-size: 200% auto;
        color: #fff;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textclip 2s linear infinite;
        display: inline-block;
      }

      @keyframes textclip {
        to {
          background-position: 200% center;
        }
      }

      body {
        background-image: url("img/us-parking-lot-byHansOfPixabay.jpg");
        background-size: 100% 100%;
        background-attachment: fixed;
      }
    </style>
  </head>

  <body>
    <header>
      <!-- place navbar here -->
    </header>
    <main>
      <div class="container my-5 d-flex justify-content-center">
        <div class="card text-white bg-dark" style="max-width: 50rem">
          <div class="card-body">
            <h4 class="card-title text-center mb-3">
              Vending Machine -
              <div class="animate-character">Save $$$!</div>
            </h4>
            <div class="container">
              <div class="row">
                <div class="col">
                  <div class="card mx-3 my-3" style="height: 6rem" id="hasilLabelSaldo">
                    <p class="fw-bold mx-2 mt-2 mb-1">Your Balance:</p>
                    <p class="mx-2 fs-3">Rp. 20.000</p>
                  </div>
                </div>
                <div class="col">
                  <div class="card mx-3 my-3" style="height: 6rem">
                    <p class="fw-bold mx-2 mt-2 mb-1" id="hasilHargaMinuman">
                      Select a snack you like
                    </p>
                    <p class="mx-2 fs-3" id="hasilMinuman">-</p>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col">
                  <div
                    class="card text-center"
                    id="item1"
                    style="height: 23rem"
                  >
                    <img
                      class="card-img-top mt-4"
                      src="img/doritos-bbq.png"
                      alt="Doritos"
                    />
                    <div class="card-body">
                      <p class="text-center mb-0">Rp. 15.000</p>
                      <p class="card-text text-center fw-bold">Doritos: BBQ</p>
                      <button
                        type="button"
                        class="btn btn-warning"
                        onclick="Vmachine('Doritos', '15000')"
                      >
                        Buy
                      </button>
                    </div>
                  </div>
                </div>
                <div class="col">
                  <div
                    class="card text-center"
                    id="item2"
                    style="height: 23rem"
                  >
                    <img
                      class="card-img-top mt-4"
                      src="img/cheetos-flamingHot.png"
                      alt="Cheetos"
                      style="height: 13rem"
                    />
                    <div class="card-body container">
                      <p class="text-center mb-0">Rp. 20.000</p>
                      <p class="card-text text-center fw-bold">
                        Cheetos: Flaming Hot
                      </p>
                      <button
                        type="button"
                        onclick="Vmachine('Cheetos', '20000')"
                        class="btn btn-warning"
                      >
                        Buy
                      </button>
                    </div>
                  </div>
                </div>
                <div class="col">
                  <div
                    class="card text-center"
                    id="item3"
                    style="height: 23rem"
                  >
                    <img
                      class="card-img-top mt-4"
                      src="img/takis-fuegoFajitas.png"
                      alt="Takis"
                      style="height: 13rem"
                    />
                    <div class="card-body container">
                      <p class="text-center mb-0">Rp. 21.000</p>
                      <p class="card-text text-center fw-bold">
                        Takis: Fuego Fajitas
                      </p>
                      <button
                        type="button"
                        onclick="Vmachine('Takis', '21000')"
                        class="btn btn-warning"
                      >
                        Buy
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="fs-6 text-center fw-semibold mb-3">
      <!-- place footer here -->
      &copy;2026 Scientia Hashina
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      let saldo = 20000;
      function Vmachine(menu, harga) {
        document.getElementById("hasilMinuman").innerHTML = menu;
        document.getElementById("hasilHargaMinuman").innerHTML = harga;
        
        const LabelSaldo = document.getElementById("hasilLabelSaldo");
        
        if (saldo >= harga) {
          console.log("Kamu bisa beli makanan ini");
          LabelSaldo.classList.remove("bg-danger");
        }else{
          LabelSaldo.classList.add("bg-danger");
          console.log("Kamu tidak bisa beli makanan ini");
        }
      }
    </script>
  </body>
</html>
